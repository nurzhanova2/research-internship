[project]
name = "xai-ews"
version = "0.1.0"
description = "Explainable early credit-risk detection on Fannie Mae Single-Family Loan Performance data (EA-TFWT)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<2.2",
    "pandas>=2.2",
    "polars>=1.9",
    "pyarrow>=17",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "torch>=2.4",
    "shap>=0.46",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "openpyxl>=3.1",
    "duckdb>=1.1",
    "catboost>=1.2",
    "optuna>=5.0.0",
    "xgboost>=3.2.0",
    "lightgbm>=4.7.0",
    "lime>=0.2.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xai_ews"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
