# Stage 2: feature selection. Rules are fixed BEFORE the selection notebooks are run
# (methodology section 5); the selected sets at the bottom are written by
# notebooks/02_6_ablation_and_final.ipynb. Read via xai_ews.features.config.feature_config().

data:
  negatives_rate: 0.2          # all positives + negatives at r, weight 1/r
  validation_exclude_hurricanes: true   # with them = sensitivity
  seed: 20261024

binning:                       # WoE binning, fitted on train only (weighted by 1/r)
  prebins: 20                  # weighted quantile pre-bins (all distinct values if fewer)
  max_bins: 10
  min_bin_share: 0.005         # of the weighted population
  min_bin_events: 30           # unweighted positives per bin
  rare_bin_rate_ratio: 2.0     # a smaller bin stays separate if it has >= min_bin_events positives and an
                               # event rate >= 2x that of its neighbours (modified loans, rare missing values, ...)
  rare_category_share: 0.001   # categories below it are pooled into "__rare__" before grouping
  smoothing: 0.5               # added to good / bad counts when computing WoE

binning_sensitivity:           # overrides of `binning` for the comparison run (first trial of 2026-10-24):
  min_bin_share: 0.0005        # uniformly small bins, no rare-bin rule, rare missing -> largest bin
  rare_bin_rate_ratio: null

rules:
  univariate:
    iv_min: 0.02               # keep if IV on train >= iv_min for at least one task (Y1 or Y2)
    iv_leak_check: 0.5         # IV above it -> look for leakage (decision documented in the report)
    decide_by: effect_size     # p-values (chi2, BH) are reported, not used: n ~ 10^6
  stability:
    psi_max: 0.25              # train -> validation PSI on the train WoE bins, non-macro groups
    psi_groups: [borrower, loan, geography, exposure, behaviour, state_at_t]
    macro_years: [2013, 2014, 2015, 2016, 2017]   # observation years: train 2013-15, validation 2016-17
    macro_iv_min_year: 0.02    # macro: IV >= this in every year ...
    macro_sign_consistent: true  # ... and the same direction in every year
    prefer_relative_macro: true  # if raw and *_rel_us both pass, keep the relative version
    sign_min_effect: 0.01      # |AUC - 0.5| below it: direction undefined, sign check not applied
    high_cardinality_top_n: {servicer_name: 20, seller_name: 20}   # rest -> "other"; drop if PSI still > psi_max
  redundancy:
    corr_max: 0.7              # |Pearson| of WoE values on train, in either task
    vif_max: 10                # iterative removal above it; 5-10 is reported as a warning
    vif_warn: 5
    sample_rows: 400000        # train subsample for correlation / VIF / mutual information
    strength: iv_max           # of a redundant pair the feature with the larger max(IV_y1, IV_y2) stays
  importance:
    train_rows: 400000         # Boruta / CatBoost subsample of the r = 0.2 train (all positives kept)
    validation_rows: 500000    # permutation importance subsample of validation
    catboost: {iterations: 300, depth: 6, learning_rate: 0.1}
    boruta_iterations: 20
    boruta_alpha: 0.05
    permutation_repeats: 3
    drop_if: boruta_rejected_both_and_permutation_le_zero_both
  ablation:
    catboost: {iterations: 300, depth: 6, learning_rate: 0.1}
    bootstrap_b: 1000          # cluster bootstrap by loan
    non_inferiority_auc: 0.005 # upper 95 % CI of ΔAUC(all candidates - selected) < this, per task
  other_models:                # steps 8-9 repeated with other learners (02_8): same rules, robustness only
    logistic_woe: {C: 1.0, max_iter: 1000}   # on train WoE values (scorecard style)
    # XGBoost / LightGBM: the Y1 settings found by the Optuna tuning of stage 3
    # (reports/modeling/posthoc/tuning_gbdt_summary.csv); with untuned defaults both overfit the
    # rare event (validation AUC 0.89 and 0.79 in the first Colab run)
    xgboost: {iterations: 368, depth: 9, learning_rate: 0.0363, l2: 3.13, min_leaf: 402, subsample: 0.851}
    lightgbm: {iterations: 335, depth: 7, num_leaves: 128, learning_rate: 0.0232, l2: 14.57, min_leaf: 1581, subsample: 0.815}
    random_forest: {trees: 300, min_samples_leaf: 50, max_features: sqrt}
    random_forest_train_rows: 400000   # subsample of the r = 0.2 train (all events kept), for memory

